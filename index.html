<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>وبینار رشد استارتاپ | ۲۳ آبان ۱۴۰۵</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--text:#111;--accent:#111;--muted:#666;} [data-theme=dark]{--bg:#0a0a0a;--text:#fff;--accent:#fff;--muted:#aaa;}
body{font-family:Vazirmatn,sans-serif;background:var(--bg);color:var(--text);margin:0;text-align:center;}
.container{max-width:800px;margin:auto;padding:40px 20px;}
h1{font-size:3.2rem;margin:40px 0 16px;}
.date{font-size:1.5rem;font-weight:600;margin:20px 0;}
.btn{background:var(--accent);color:var(--bg);padding:18px 48px;text-decoration:none;border-radius:10px;font-size:1.2rem;font-weight:700;display:inline-block;margin:30px 0;}
.details{text-align:right;margin:40px 0;line-height:2;}
</style>
</head>
<body>
<div class="container">
<button style="position:absolute;top:20px;left:20px;" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme?'':'dark'">تم</button>
<h1>رشد استارتاپ<br>با ابزارهای ایرانی</h1>
<div class="date">شنبه ۲۳ آبان ۱۴۰۵ · ساعت ۱۸:۳۰</div>
<p>چگونه بدون وابستگی به سرویس‌های خارجی، محصولتان را رشد دهید.</p>
<a href="mailto:register@webinar.ir" class="btn">ثبت‌نام رایگان</a>
<div class="details">
<p>✓ ابزارهای پرداخت و حسابداری ایرانی</p>
<p>✓ مدیریت مشتری و پشتیبانی فارسی</p>
<p>✓ رشد بدون تبلیغات گران خارجی</p>
<p>مدت وبینار: ۹۰ دقیقه + پرسش و پاسخ</p>
</div>
</div>
<script>if(localStorage.theme==='dark')document.documentElement.dataset.theme='dark';</script>
</body>
</html>
